name: Deploy Angular UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'warehouse_ui/**'
      - '.github/workflows/deploy-warehouse-ui-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: warehouse_ui/package-lock.json

      - name: Install dependencies
        working-directory: warehouse_ui
        run: npm ci

      - name: Build Angular UI
        working-directory: warehouse_ui
        run: npm run build -- --base-href /WarehouseManagementApp/

      - name: Add Angular route fallback
        run: cp warehouse_ui/dist/warehouse_ui/browser/index.html warehouse_ui/dist/warehouse_ui/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: warehouse_ui/dist/warehouse_ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
